<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invenergy | Contract Intelligence &amp; HITL Review Workspace</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    /* ==========================================================================
       Invenergy Official Brand Design System Tokens (Extracted from invenergy.com)
       ========================================================================== */
    :root {
      /* Brand Core */
      --brand-invenergy-green: #118751;
      --brand-dark-green: #042B19;
      --brand-pine-green: #0F633C;
      --brand-canopy-green: #084B2C;
      --brand-yellow: #FFCF0B;

      /* Neutrals & Surfaces */
      --neutrals-white: #FFFFFF;
      --neutrals-light-green: #F5F8F7;
      --neutrals-mint-wash: #EAF8F1;
      --neutrals-sage-green: #CEE4DA;
      --neutrals-dark-grey: #97A79F;
      --neutrals-gray: #626D68;
      --neutrals-light-blue: #F7FCFF;
      --neutrals-blue: #DDEDF6;
      --feedback-gray: #ECECEC;

      /* Domain Technology & Status Accents */
      --tech-wind: #0F633C;
      --tech-solar: #F9AE1C;
      --tech-storage: #0E79AF;
      --tech-clean-water: #44C8F5;
      --tech-services: #1F2A44;
      --tech-transmission: #612C83;
      --feedback-green: #059641;
      --feedback-red: #D21313;

      /* Typography Stacks */
      --font-sans: NeueHelvetica, "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-condensed: "Helvetica Neue Condensed Bold", "Helvetica Neue", "Arial Narrow", Arial, sans-serif;
      --font-mono: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

      /* Motion & Radii */
      --ease-smooth: cubic-bezier(0.32, 0.72, 0, 1);
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --shadow-card: 0 1px 3px rgba(4, 43, 25, 0.06), 0 1px 2px rgba(4, 43, 25, 0.04);
      --shadow-card-hover: 0 6px 16px rgba(4, 43, 25, 0.09);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-feature-settings: "cv11";
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--neutrals-light-green);
      color: var(--brand-dark-green);
      height: 100dvh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Executive Top Header (Deep Forest Green #042B19) */
    header {
      background: var(--brand-dark-green);
      color: var(--neutrals-white);
      border-bottom: 2px solid var(--brand-invenergy-green);
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 2px 10px rgba(4, 43, 25, 0.18);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      height: 26px;
      flex-shrink: 0;
    }

    .brand-divider {
      width: 1px;
      height: 22px;
      background: rgba(206, 228, 218, 0.3);
    }

    .brand-title {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
      color: var(--neutrals-white);
    }

    .brand span.badge {
      background: rgba(17, 135, 81, 0.28);
      color: var(--neutrals-sage-green);
      border: 1px solid rgba(255, 207, 11, 0.45);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Form Controls & Buttons */
    select, input[type="text"], input[type="number"], textarea, button {
      font-family: var(--font-sans);
      background: var(--neutrals-white);
      color: var(--brand-dark-green);
      border: 1px solid var(--neutrals-sage-green);
      border-radius: var(--radius-md);
      padding: 7px 12px;
      font-size: 13px;
      line-height: 1.35;
      transition: all 180ms var(--ease-smooth);
    }

    select:focus, input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
      outline: 2px solid var(--brand-invenergy-green);
      outline-offset: 1px;
      border-color: var(--brand-invenergy-green);
    }

    header select,
    header input[type="file"] {
      background: rgba(255, 255, 255, 0.08);
      color: var(--neutrals-white);
      border: 1px solid rgba(206, 228, 218, 0.32);
      border-radius: var(--radius-md);
      padding: 6px 10px;
      font-size: 12px;
    }

    header select option {
      background: var(--brand-dark-green);
      color: var(--neutrals-white);
    }

    header button:not(.primary) {
      background: rgba(255, 255, 255, 0.08);
      color: var(--neutrals-white);
      border: 1px solid rgba(206, 228, 218, 0.35);
      font-size: 12px;
      font-weight: 600;
    }

    header button:not(.primary):hover {
      background: rgba(17, 135, 81, 0.35);
      border-color: var(--brand-yellow);
    }

    button {
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    button:active:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      background: var(--feedback-gray) !important;
      color: var(--neutrals-gray) !important;
      border-color: var(--neutrals-dark-grey) !important;
      cursor: not-allowed;
      opacity: 1;
    }

    button.primary {
      background: var(--brand-invenergy-green);
      color: var(--neutrals-white);
      border-color: var(--brand-invenergy-green);
      box-shadow: 0 1px 2px rgba(4, 43, 25, 0.2);
    }

    button.primary:hover:not(:disabled) {
      background: var(--brand-pine-green);
      border-color: var(--brand-pine-green);
    }

    button.success {
      background: var(--brand-invenergy-green);
      color: var(--neutrals-white);
      border-color: var(--brand-invenergy-green);
      padding: 8px 14px;
    }

    button.success:hover:not(:disabled) {
      background: var(--brand-pine-green);
      border-color: var(--brand-pine-green);
    }

    /* Main Split-Screen Workspace */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 52% 48%;
      overflow: hidden;
    }

    .left-pane {
      background: var(--neutrals-light-green);
      border-right: 1px solid var(--neutrals-sage-green);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Document Metadata Summary Bar */
    .meta-bar {
      background: var(--neutrals-white);
      border-bottom: 1px solid var(--neutrals-sage-green);
      padding: 11px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12.5px;
      color: var(--brand-dark-green);
    }

    .meta-bar code {
      font-family: var(--font-mono);
      background: var(--neutrals-mint-wash);
      color: var(--brand-pine-green);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
    }

    /* Invenergy Tracked Uppercase Navigation Tabs */
    .tabs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--neutrals-white);
      border-bottom: 1px solid var(--neutrals-sage-green);
      padding: 0 18px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tab-buttons {
      display: flex;
      gap: 4px;
    }

    .tab-btn {
      padding: 11px 14px;
      border-radius: 0;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--neutrals-gray);
      transition: all 160ms var(--ease-smooth);
    }

    .tab-btn:hover {
      color: var(--brand-dark-green);
      background: var(--neutrals-light-green);
    }

    .tab-btn.active {
      color: var(--brand-dark-green);
      background: var(--neutrals-mint-wash);
      border-bottom-color: var(--brand-invenergy-green);
    }

    .context-toggle-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--brand-dark-green);
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: var(--radius-md);
      background: var(--neutrals-light-green);
      border: 1px solid var(--neutrals-sage-green);
    }

    .context-toggle-label input[type="checkbox"] {
      accent-color: var(--brand-invenergy-green);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    /* Clause Hierarchy Cards List */
    .content-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .clause-card {
      background: var(--neutrals-white);
      border: 1px solid var(--neutrals-sage-green);
      border-left: 4px solid var(--feedback-green);
      border-radius: var(--radius-lg);
      padding: 13px 16px;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: border-color 180ms var(--ease-smooth), box-shadow 180ms var(--ease-smooth), transform 180ms var(--ease-smooth);
    }

    .clause-card:hover {
      border-color: var(--brand-invenergy-green);
      box-shadow: var(--shadow-card-hover);
    }

    .clause-card.selected {
      border-color: var(--brand-invenergy-green);
      background: #FCFDFD;
      box-shadow: 0 0 0 2px rgba(17, 135, 81, 0.18), var(--shadow-card-hover);
    }

    .clause-card.flagged {
      border-left: 4px solid var(--tech-solar);
    }

    .clause-card.placeholder {
      border-left: 4px solid var(--tech-transmission);
    }

    .clause-card.approved {
      border-left: 4px solid var(--tech-storage);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      flex-wrap: wrap;
    }

    .path-pill {
      font-family: var(--font-mono);
      background: var(--neutrals-mint-wash);
      border: 1px solid var(--neutrals-sage-green);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      color: var(--brand-pine-green);
      font-weight: 700;
      font-size: 11.5px;
    }

    .clause-title-text {
      color: var(--neutrals-gray);
      font-weight: 600;
      margin-left: 6px;
    }

    .page-badge {
      color: var(--neutrals-gray);
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      margin-right: 6px;
    }

    /* Status Pills Mapped to Invenergy Domain Palette */
    .status-pill {
      font-size: 10.5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-VERIFIED_AUTO,
    .status-COMPLETED {
      background: var(--neutrals-mint-wash);
      color: var(--feedback-green);
      border: 1px solid var(--neutrals-sage-green);
    }

    .status-FLAGGED_FOR_REVIEW,
    .status-NEEDS_HITL_REVIEW {
      background: #FFFBEB;
      color: #975A16;
      border: 1px solid #F6E05E;
    }

    .status-PLACEHOLDER_FOR_REVIEW {
      background: #FAF5FF;
      color: var(--tech-transmission);
      border: 1px solid #E9D5FF;
    }

    .status-APPROVED_BY_HUMAN {
      background: var(--neutrals-light-blue);
      color: var(--tech-storage);
      border: 1px solid var(--neutrals-blue);
    }

    .clause-text {
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--brand-dark-green);
      white-space: pre-wrap;
      margin: 6px 0;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      background: var(--neutrals-light-green);
      border: 1px solid var(--neutrals-sage-green);
      color: var(--neutrals-gray);
    }

    .chip.flag-chip {
      background: #FFFBEB;
      color: #975A16;
      border: 1px solid #F6E05E;
      font-weight: 700;
    }

    /* HITL Review Drawer */
    .review-drawer {
      margin-top: 12px;
      padding: 12px;
      background: var(--neutrals-light-green);
      border: 1px solid var(--neutrals-sage-green);
      border-radius: var(--radius-md);
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .clause-card.selected .review-drawer {
      display: flex;
    }

    .drawer-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--brand-pine-green);
    }

    /* Right Pane: Synchronized PDF.js Document Stage */
    .right-pane {
      display: flex;
      flex-direction: column;
      background: var(--tech-services);
      overflow: hidden;
    }

    .pdf-toolbar {
      background: var(--brand-canopy-green);
      color: var(--neutrals-white);
      border-bottom: 1px solid rgba(206, 228, 218, 0.25);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pdf-toolbar button {
      background: rgba(255, 255, 255, 0.1);
      color: var(--neutrals-white);
      border: 1px solid rgba(206, 228, 218, 0.35);
      padding: 5px 10px;
      font-size: 12px;
    }

    .pdf-toolbar button:hover {
      background: var(--brand-invenergy-green);
      border-color: var(--brand-yellow);
    }

    .pdf-toolbar input[type="number"] {
      width: 62px;
      background: rgba(255, 255, 255, 0.12);
      color: var(--neutrals-white);
      border: 1px solid rgba(206, 228, 218, 0.4);
      border-radius: var(--radius-sm);
      padding: 4px 6px;
      font-family: var(--font-mono);
      text-align: center;
    }

    #pdf-canvas-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .pdf-page-wrapper {
      background: var(--neutrals-white);
      padding: 8px;
      border-radius: var(--radius-md);
      box-shadow: 0 8px 24px rgba(4, 43, 25, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid transparent;
      transition: border-color 200ms var(--ease-smooth), box-shadow 200ms var(--ease-smooth);
    }

    .pdf-page-wrapper.highlighted {
      border-color: var(--brand-invenergy-green);
      outline: 3px solid var(--brand-yellow);
    }

    .pdf-page-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--brand-dark-green);
      background: var(--neutrals-mint-wash);
      border: 1px solid var(--neutrals-sage-green);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    @media (max-width: 960px) {
      body {
        height: auto;
        overflow-y: auto;
      }
      .workspace {
        grid-template-columns: 1fr;
      }
      .left-pane, .right-pane {
        min-height: 70dvh;
      }
    }
  </style>
</head>

        </svg>
      </a>
      <span class="brand-divider"></span>
      <span class="brand-title">Hierarchical Contract Intelligence</span>
      <span class="badge">Gemini 3.x + Append-Only BigQuery + pdf.js</span>
    </div>
    <div class="toolbar">
      <input type="file" id="pdf-upload-input" accept=".pdf" />
      <button class="primary" id="upload-btn" onclick="uploadPdf()">Upload &amp; Parse PDF</button>
      <select id="document-selector" onchange="loadSelectedDocument()"></select>
      <button onclick="downloadCsv('clauses.csv')">clauses.csv</button>
      <button onclick="downloadCsv('defined_terms.csv')">defined_terms.csv</button>
      <button onclick="downloadCsv('exhibits_catalog.csv')">exhibits_catalog.csv</button>
    </div>
  </header>

  <div class="workspace">
    <!-- Left Pane: Contract Outline, Context Toggle, Terms, Exhibits & HITL Queue -->
    <div class="left-pane">
      <div class="meta-bar" id="doc-meta-bar">
        <span>Select or upload a legal contract PDF to inspect its hierarchy tree and HITL review flags.</span>
      </div>
      <div class="tabs">
        <div class="tab-buttons">
          <button class="tab-btn active" id="tab-all" onclick="setTab('all')">Clause Hierarchy</button>
          <button class="tab-btn" id="tab-flagged" onclick="setTab('flagged')">HITL Review Queue</button>
          <button class="tab-btn" id="tab-terms" onclick="setTab('terms')">Defined Terms</button>
          <button class="tab-btn" id="tab-exhibits" onclick="setTab('exhibits')">Exhibits Catalog</button>
        </div>
        <label class="context-toggle-label">
          <input type="checkbox" id="context-toggle" checked onchange="renderLeftPane()" />
          Show Full Reconstructed Context
        </label>
      </div>
      <div class="content-list" id="left-content-list"></div>
    </div>

    <!-- Right Pane: Mozilla pdf.js Multi-Page Canvas Viewer -->
    <div class="right-pane">
      <div class="pdf-toolbar">
        <div>
          <strong id="pdf-page-indicator">PDF Viewer (Physical Page 1)</strong>
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
          <button onclick="changeZoom(-0.2)">Zoom -</button>
          <span id="zoom-label" style="font-family:var(--font-mono); font-weight:700;">115%</span>
          <button onclick="changeZoom(0.2)">Zoom +</button>
          <input type="number" id="jump-page-input" min="1" value="1" />
          <button onclick="jumpToPage(parseInt(document.getElementById('jump-page-input').value || '1', 10))">Go to Page</button>
        </div>
      </div>
      <div id="pdf-canvas-container"></div>
    </div>
  </div>

  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }

    let currentBundle = null;
    let currentTab = "all";
    let selectedNodeId = null;
    let pdfDoc = null;
    let pdfScale = 1.15;

    async function fetchDocumentsList(selectDocId = null) {
      const res = await fetch("/api/v1/documents");
      const data = await res.json();
      const selector = document.getElementById("document-selector");
      selector.innerHTML = "";
      for (const doc of data.documents || []) {
        const opt = document.createElement("option");
        opt.value = doc.document_id;
        opt.textContent = `${doc.filename} (${doc.flagged_node_count} flags · ${doc.ingestion_status})`;
        selector.appendChild(opt);
      }
      const targetId = selectDocId || (data.documents && data.documents[0] && data.documents[0].document_id);
      if (targetId) {
        selector.value = targetId;
        await loadDocumentBundle(targetId);
      }
    }

    async function loadSelectedDocument() {
      const docId = document.getElementById("document-selector").value;
      if (docId) {
        await loadDocumentBundle(docId);
      }
    }

    async function uploadPdf() {
      const input = document.getElementById("pdf-upload-input");
      if (!input.files || !input.files[0]) {
        alert("Choose a PDF file first.");
        return;
      }
      const btn = document.getElementById("upload-btn");
      btn.disabled = true;
      btn.textContent = "Parsing with Gemini 3.x...";
      try {
        const formData = new FormData();
        formData.append("file", input.files[0]);
        const res = await fetch("/api/v1/documents/upload", { method: "POST", body: formData });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Upload failed");
        }
        const bundle = await res.json();
        await fetchDocumentsList(bundle.document.document_id);
      } catch (err) {
        alert("Upload error: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Upload & Parse PDF";
      }
    }

    async function loadDocumentBundle(docId) {
      const res = await fetch(`/api/v1/documents/${docId}`);
      if (!res.ok) return;
      currentBundle = await res.json();
      renderMetaBar();
      renderLeftPane();
      await renderPdfDocument(currentBundle.pdf_url);
    }

    function renderMetaBar() {
      if (!currentBundle) return;
      const doc = currentBundle.document;
      let partiesText = "";
      try {
        const parties = JSON.parse(doc.contracting_parties_json || "[]");
        partiesText = parties.map(p => p.name || p.short_name || JSON.stringify(p)).join(" ↔ ");
      } catch (_) {
        partiesText = doc.contracting_parties_json || "";
      }
      document.getElementById("doc-meta-bar").innerHTML = `
        <div>
          <strong>${escapeHtml(doc.filename)}</strong> · <span>ID: <code>${escapeHtml(doc.document_id)}</code></span>
          ${doc.effective_date ? ` · Effective: <strong>${escapeHtml(doc.effective_date)}</strong>` : ""}
          ${partiesText ? ` · Parties: <span>${escapeHtml(partiesText)}</span>` : ""}
        </div>
        <div>
          <span>Pages: <strong>${doc.page_count}</strong></span> ·
          <span>Clauses: <strong>${currentBundle.clauses.length}</strong></span> ·
          <span>Open Flags: <strong>${doc.flagged_node_count}</strong></span> ·
          <span class="status-pill status-${doc.ingestion_status}">${doc.ingestion_status}</span>
        </div>
      `;
    }

    function setTab(tabName) {
      currentTab = tabName;
      for (const id of ["all", "flagged", "terms", "exhibits"]) {
        document.getElementById(`tab-${id}`).classList.toggle("active", id === tabName);
      }
      renderLeftPane();
    }

    function renderLeftPane() {
      const container = document.getElementById("left-content-list");
      container.innerHTML = "";
      if (!currentBundle) return;

      const showReconstructed = document.getElementById("context-toggle").checked;

      if (currentTab === "terms") {
        for (const t of currentBundle.defined_terms) {
          const card = document.createElement("div");
          card.className = "clause-card";
          card.onclick = () => jumpToPage(t.page_number);
          card.innerHTML = `
            <div class="card-header">
              <span class="path-pill">"${escapeHtml(t.term_name)}"</span>
              <span class="page-badge">Defined in <code>${escapeHtml(t.defined_in_node_id)}</code> · Page ${t.page_number}</span>
            </div>
            <div class="clause-text">${escapeHtml(t.verbatim_definition)}</div>
            <div class="chip-row">
              <span class="chip">${escapeHtml(t.definition_type)}</span>
              <span class="chip">Used in: ${escapeHtml(t.referenced_in_nodes)}</span>
            </div>
          `;
          container.appendChild(card);
        }
        return;
      }

      if (currentTab === "exhibits") {
        for (const ex of currentBundle.exhibits_catalog) {
          const card = document.createElement("div");
          card.className = "clause-card" + (ex.has_unresolved_external_dep ? " flagged" : "");
          card.onclick = () => jumpToPage(ex.page_start);
          card.innerHTML = `
            <div class="card-header">
              <span class="path-pill">${escapeHtml(ex.exhibit_id)} — ${escapeHtml(ex.exhibit_title)}</span>
              <span class="page-badge">Pages ${ex.page_start}–${ex.page_end}</span>
            </div>
            <div class="clause-text"><code style="font-family:var(--font-mono); font-size:12px;">${escapeHtml(ex.structured_entities_json)}</code></div>
            <div class="chip-row">
              <span class="chip">${escapeHtml(ex.exhibit_modality)}</span>
              <span class="chip">Referenced by: ${escapeHtml(ex.referenced_by_nodes)}</span>
              ${ex.has_unresolved_external_dep ? `<span class="chip flag-chip">UNRESOLVED_EXTERNAL_DEPENDENCY</span>` : ""}
            </div>
          `;
          container.appendChild(card);
        }
        return;
      }

      const clauses = currentBundle.clauses.filter(c => {
        if (currentTab === "flagged") {
          return c.hitl_status === "FLAGGED_FOR_REVIEW" || c.hitl_status === "PLACEHOLDER_FOR_REVIEW";
        }
        return true;
      });

      for (const c of clauses) {
        const card = document.createElement("div");
        const statusClass =
          c.hitl_status === "FLAGGED_FOR_REVIEW" ? "flagged" :
          c.hitl_status === "PLACEHOLDER_FOR_REVIEW" ? "placeholder" :
          c.hitl_status === "APPROVED_BY_HUMAN" ? "approved" : "";
        const isSelected = selectedNodeId === c.node_id ? "selected" : "";
        card.className = `clause-card ${statusClass} ${isSelected}`;
        card.style.marginLeft = `${Math.max(0, (c.depth - 1) * 18)}px`;

        const displayedText = showReconstructed ? c.reconstructed_context_text : c.verbatim_text;
        const flags = (c.hitl_flag_reasons && c.hitl_flag_reasons !== "NONE") ? c.hitl_flag_reasons.split("|") : [];
        const terms = (c.defined_terms_used && c.defined_terms_used !== "NONE") ? c.defined_terms_used.split("|") : [];

        card.innerHTML = `
          <div class="card-header" onclick="selectClause('${c.node_id}', ${c.page_start})">
            <div>
              <span class="path-pill">${escapeHtml(c.canonical_path)}</span>
              <strong style="margin-left:6px;">${escapeHtml(c.clause_label)}</strong>
              ${c.clause_title ? `<span class="clause-title-text">${escapeHtml(c.clause_title)}</span>` : ""}
              ${c.is_inline_clause ? `<span class="chip" style="margin-left:6px;">inline</span>` : ""}
            </div>
            <div>
              <span class="page-badge">p. ${c.page_start}${c.page_end !== c.page_start ? `–${c.page_end}` : ""}</span>
              <span class="status-pill status-${c.hitl_status}">${c.hitl_status}</span>
            </div>
          </div>
          <div class="clause-text" onclick="selectClause('${c.node_id}', ${c.page_start})">${escapeHtml(displayedText)}</div>
          <div class="chip-row">
            ${flags.map(f => `<span class="chip flag-chip">${escapeHtml(f)}</span>`).join("")}
            ${terms.map(t => `<span class="chip">Term: ${escapeHtml(t)}</span>`).join("")}
            ${c.reviewed_by ? `<span class="chip">Reviewed by ${escapeHtml(c.reviewed_by)}</span>` : ""}
          </div>
          <div class="review-drawer" onclick="event.stopPropagation()">
            <label class="drawer-label">Atomic Verbatim Text</label>
            <textarea id="edit-verbatim-${c.node_id}" rows="2">${escapeHtml(c.verbatim_text)}</textarea>
            <label class="drawer-label">Reconstructed Full-Context Text</label>
            <textarea id="edit-context-${c.node_id}" rows="3">${escapeHtml(c.reconstructed_context_text)}</textarea>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <input type="text" id="edit-reviewer-${c.node_id}" value="${escapeHtml(c.reviewed_by || 'legal_analyst')}" placeholder="Reviewer" style="width:150px;" />
              <input type="text" id="edit-notes-${c.node_id}" value="${escapeHtml(c.review_notes || '')}" placeholder="Review notes..." style="flex:1;" />
              <button class="success" onclick="approveClause('${c.node_id}')">Approve &amp; Save Version</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      }
    }

    function selectClause(nodeId, pageStart) {
      selectedNodeId = nodeId;
      renderLeftPane();
      jumpToPage(pageStart);
    }

    async function approveClause(nodeId) {
      if (!currentBundle) return;
      const docId = currentBundle.document.document_id;
      const verbatimText = document.getElementById(`edit-verbatim-${nodeId}`).value;
      const contextText = document.getElementById(`edit-context-${nodeId}`).value;
      const reviewedBy = document.getElementById(`edit-reviewer-${nodeId}`).value || "legal_analyst";
      const reviewNotes = document.getElementById(`edit-notes-${nodeId}`).value || "Approved in HITL Web UI";

      const res = await fetch(`/api/v1/documents/${docId}/clauses/${encodeURIComponent(nodeId)}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          hitl_status: "APPROVED_BY_HUMAN",
          verbatim_text: verbatimText,
          reconstructed_context_text: contextText,
          reviewed_by: reviewedBy,
          review_notes: reviewNotes
        })
      });
      if (!res.ok) {
        alert("Failed to save review version.");
        return;
      }
      await loadDocumentBundle(docId);
      await fetchDocumentsList(docId);
    }

    async function renderPdfDocument(pdfUrl) {
      const container = document.getElementById("pdf-canvas-container");
      container.innerHTML = "";
      document.getElementById("zoom-label").textContent = `${Math.round(pdfScale * 100)}%`;

      if (!window.pdfjsLib) {
        container.innerHTML = `<iframe src="${pdfUrl}" style="width:100%; height:100%; border:none;"></iframe>`;
        return;
      }
      try {
        const loadingTask = window.pdfjsLib.getDocument(pdfUrl);
        pdfDoc = await loadingTask.promise;
        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
          const page = await pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: pdfScale });
          const wrapper = document.createElement("div");
          wrapper.className = "pdf-page-wrapper";
          wrapper.id = `pdf-page-${pageNum}`;

          const label = document.createElement("div");
          label.className = "pdf-page-label";
          label.textContent = `Physical Page ${pageNum} of ${pdfDoc.numPages}`;

          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          wrapper.appendChild(label);
          wrapper.appendChild(canvas);
          container.appendChild(wrapper);

          await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        }
      } catch (err) {
        container.innerHTML = `<iframe src="${pdfUrl}" style="width:100%; height:100%; border:none;"></iframe>`;
      }
    }

    function jumpToPage(pageNumber) {
      const pageNum = Math.max(1, parseInt(pageNumber || 1, 10));
      document.getElementById("jump-page-input").value = pageNum;
      document.getElementById("pdf-page-indicator").textContent = `PDF Viewer (Physical Page ${pageNum})`;
      for (const el of document.querySelectorAll(".pdf-page-wrapper")) {
        el.classList.remove("highlighted");
      }
      const target = document.getElementById(`pdf-page-${pageNum}`);
      if (target) {
        target.classList.add("highlighted");
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    async function changeZoom(delta) {
      pdfScale = Math.min(2.4, Math.max(0.6, pdfScale + delta));
      if (currentBundle) {
        await renderPdfDocument(currentBundle.pdf_url);
      }
    }

    function downloadCsv(csvName) {
      if (!currentBundle) return;
      const docId = currentBundle.document.document_id;
      window.open(`/api/v1/documents/${docId}/export/${csvName}`, "_blank");
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    fetchDocumentsList();
  </script>
</body>
</html>
